# Overrides on top of Detekt's default configuration (buildUponDefaultConfig = true).
config:
  validation: true

comments:
  UndocumentedPublicClass:
    active: true
    excludes: ['**/test/**', '**/testFixtures/**', '**/app/src/**']
    ignoreAnnotated: ['ContributesTo', 'DependencyGraph']
  UndocumentedPublicFunction:
    active: true
    excludes: ['**/test/**', '**/testFixtures/**', '**/app/src/**']
    ignoreAnnotated: ['Composable', 'Provides']
  UndocumentedPublicProperty:
    active: true
    excludes: ['**/test/**', '**/testFixtures/**', '**/app/src/**']

style:
  ForbiddenMethodCall:
    active: true
    methods:
      - value: 'kotlin.runCatching'
        reason: >-
          Also catches CancellationException and Error. At boundaries, use runCatchingExceptions
          from :core:error; elsewhere, catch specific exception types.

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
